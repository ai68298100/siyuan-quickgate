name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run check
      - run: corepack pnpm test
      # MCP 协议冒烟（stdio 会话，无需内核）
      - run: corepack pnpm run smoke:mcp
        env:
          SMOKE_SKIP_LIVE: "1"
      # MCP bundle 构建（esbuild JS API，pnpm 布局探测）
      - run: corepack pnpm run build:mcp
      - run: corepack pnpm run build
      # 发布自查：Token/个人路径/内网地址泄露扫描（§11 红线，命中即红）
      - run: corepack pnpm run check:release
      # 发布供应链（R78）：SHA-256 校验 + SBOM（依赖清单）
      - name: Generate SHA-256 + SBOM
        run: |
          if [ -f package.zip ]; then
            sha256sum package.zip > package.zip.sha256
            echo "package.zip.sha256 generated"
          fi
          corepack pnpm list --depth 0 --json > sbom-dependencies.json || true
          echo "sbom-dependencies.json generated"
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            package.zip
            package.zip.sha256
            sbom-dependencies.json
          if-no-files-found: error
