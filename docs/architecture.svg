<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c62ff"/>
    </marker>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8162ff"/><stop offset="1" stop-color="#388cff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" fill="#f6f8fd"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#2b3a55">小驴快门 · 生态中枢与外部网关（v0.2.0）</text>

  <!-- 外部客户端 -->
  <g font-size="13">
    <rect x="40" y="90" width="170" height="54" rx="12" fill="#ffffff" stroke="#d7deee"/>
    <text x="125" y="113" text-anchor="middle" font-weight="600" fill="#2b3a55">Quicker</text>
    <text x="125" y="132" text-anchor="middle" fill="#8a94a8">子程序同信封</text>
    <rect x="40" y="170" width="170" height="54" rx="12" fill="#ffffff" stroke="#d7deee"/>
    <text x="125" y="193" text-anchor="middle" font-weight="600" fill="#2b3a55">iOS 快捷指令</text>
    <text x="125" y="212" text-anchor="middle" fill="#8a94a8">经内核 API 直发</text>
    <rect x="40" y="250" width="170" height="54" rx="12" fill="#ffffff" stroke="#d7deee"/>
    <text x="125" y="273" text-anchor="middle" font-weight="600" fill="#2b3a55">node CLI / PowerShell</text>
    <text x="125" y="292" text-anchor="middle" fill="#8a94a8">tools/</text>
    <rect x="40" y="330" width="170" height="54" rx="12" fill="#ffffff" stroke="#d7deee"/>
    <text x="125" y="353" text-anchor="middle" font-weight="600" fill="#2b3a55">HA / 脚本</text>
    <text x="125" y="372" text-anchor="middle" fill="#8a94a8">任意 HTTP 客户端</text>
  </g>

  <!-- 内核通道 -->
  <rect x="300" y="150" width="200" height="220" rx="16" fill="#ffffff" stroke="#d7deee"/>
  <text x="400" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3a55">思源内核文件 API</text>
  <rect x="320" y="200" width="160" height="40" rx="8" fill="#eef1fb" stroke="#c3cdf0"/>
  <text x="400" y="225" text-anchor="middle" font-size="12" fill="#44507a">commands.ndjson</text>
  <rect x="320" y="260" width="160" height="40" rx="8" fill="#e6f7ef" stroke="#bfe6d4"/>
  <text x="400" y="285" text-anchor="middle" font-size="12" fill="#1f6f52">results.ndjson（≤200 行）</text>
  <text x="400" y="330" text-anchor="middle" font-size="11" fill="#8a94a8">NDJSON · id 记账 · TTL · 幂等</text>
  <text x="400" y="348" text-anchor="middle" font-size="11" fill="#8a94a8">惰性压缩：并发追加不丢失</text>

  <!-- 快门 -->
  <rect x="560" y="150" width="200" height="220" rx="16" fill="url(#hub)"/>
  <text x="660" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">小驴快门</text>
  <text x="660" y="206" text-anchor="middle" font-size="11" fill="#e6e2ff">单飞轮询 500ms · 退避</text>
  <g font-size="11.5" fill="#ffffff">
    <text x="580" y="238">commands.list / search / run</text>
    <text x="580" y="262">checkin.* / contacts.* 透传</text>
    <text x="580" y="286">editor.context / daily.status</text>
    <text x="580" y="310">registry.* / diagnostics.*</text>
    <text x="580" y="334">config.discover / plugin.api</text>
  </g>
  <text x="660" y="358" text-anchor="middle" font-size="10.5" fill="#d9d2ff">确认门控 30s · 审计 · 默认关桥</text>

  <!-- 生态插件 -->
  <g font-size="12">
    <rect x="820" y="80" width="120" height="44" rx="10" fill="#ffffff" stroke="#d7deee"/>
    <text x="880" y="107" text-anchor="middle" fill="#2b3a55" font-weight="600">雷切 stable</text>
    <rect x="820" y="134" width="120" height="44" rx="10" fill="#ffffff" stroke="#d7deee"/>
    <text x="880" y="161" text-anchor="middle" fill="#2b3a55" font-weight="600">打卡 v5 stable</text>
    <rect x="820" y="188" width="120" height="44" rx="10" fill="#ffffff" stroke="#d7deee"/>
    <text x="880" y="215" text-anchor="middle" fill="#2b3a55" font-weight="600">人脉 v1 stable</text>
    <rect x="820" y="242" width="120" height="44" rx="10" fill="#f3f5fb" stroke="#d7deee" stroke-dasharray="5 4"/>
    <text x="880" y="269" text-anchor="middle" fill="#8a94a8">管家 design</text>
    <rect x="820" y="296" width="120" height="44" rx="10" fill="#f3f5fb" stroke="#d7deee" stroke-dasharray="5 4"/>
    <text x="880" y="323" text-anchor="middle" fill="#8a94a8">闪卡 design</text>
    <rect x="820" y="350" width="120" height="44" rx="10" fill="#f3f5fb" stroke="#d7deee" stroke-dasharray="5 4"/>
    <text x="880" y="377" text-anchor="middle" fill="#8a94a8">考试 design</text>
    <rect x="820" y="404" width="120" height="44" rx="10" fill="#f3f5fb" stroke="#d7deee" stroke-dasharray="2 4"/>
    <text x="880" y="431" text-anchor="middle" fill="#b3bccf">拾遗 unlocated</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#7c62ff" stroke-width="2" fill="none">
    <path d="M210 117 L300 220" marker-end="url(#arrow)"/>
    <path d="M210 197 L296 237" marker-end="url(#arrow)"/>
    <path d="M210 277 L296 277" marker-end="url(#arrow)"/>
    <path d="M210 357 L300 320" marker-end="url(#arrow)"/>
    <path d="M500 237 L560 240" marker-end="url(#arrow)"/>
    <path d="M500 285 L560 280" marker-end="url(#arrow)" stroke="#2bb39b"/>
    <path d="M760 200 L816 150" marker-end="url(#arrow)"/>
    <path d="M760 250 L816 156" marker-end="url(#arrow)"/>
    <path d="M760 262 L816 210" marker-end="url(#arrow)"/>
    <path d="M760 310 L816 264" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
    <path d="M760 330 L816 318" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
    <path d="M760 350 L816 372" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
  </g>

  <text x="480" y="520" text-anchor="middle" font-size="12" fill="#8a94a8">实线 = 已实现（stable 接入）· 虚线 = 设计态（仅 manifest/诊断）· 队列并发追加不丢失（D-0002）· 全链审计与确认门控</text>
</svg>
